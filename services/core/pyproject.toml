[project]
name = "jarvis-core"
version = "0.3.0"
description = "Jarvis OS core service: voice pipeline, AI brain and widget host."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "structlog>=24.1",
  "psutil>=6.0",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
]

[project.optional-dependencies]
# Local speech models. Heavy (pulls in PyTorch / ONNX runtime), so they are
# opt-in:  uv sync --extra voice
voice = [
  "faster-whisper>=1.1",
  "openwakeword>=0.6",
  "kokoro>=0.9.4",
  "webrtcvad-wheels>=2.0.14",
  "silero-vad>=5.1",
]
# Voice ID (speaker verification). Requires the voice extra as well.
speaker = ["speechbrain>=1.0"]
# Model Context Protocol client for external tool servers.
mcp = ["mcp>=1.2"]
# PyTorch build for the speech models. Pick ONE (they conflict):
#   NVIDIA GPU:  uv sync --extra voice --extra cu128
#   CPU only:    uv sync --extra voice --extra cpu
cu128 = ["torch>=2.7", "torchaudio>=2.7"]
cpu = ["torch>=2.7", "torchaudio>=2.7"]

[project.scripts]
jarvis-core = "jarvis_core.__main__:main"
jarvis-doctor = "jarvis_core.doctor:main"
jarvis-token = "jarvis_core.tokens_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "ASYNC",    # async pitfalls
  "D",        # docstrings (documentation lives in the code, too)
]
ignore = [
  "D105",  # magic-method docstrings
  "D107",  # __init__ docstrings: constructor args are documented on the class
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are designed to be used as defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ASYNC109", "ASYNC110", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*", "openwakeword.*", "kokoro.*", "webrtcvad.*",
  "torch.*", "silero_vad.*", "speechbrain.*", "mcp.*",
  "icalendar.*", "recurring_ical_events.*", "psutil.*", "ctranslate2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
